[project]
name = "python-testing"
version = "0.1.0"
description = "Practice automated testing with Python"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-mock>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integration: tests that combine several modules"]
[tool.coverage.run]
source = ["shop"]
branch = true
